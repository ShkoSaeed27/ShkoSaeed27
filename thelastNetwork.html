<script>
    document.addEventListener("DOMContentLoaded", function(){
        const puzzleButton = document.getElementById('puzzle-btn');
        const isUnlocked = localStorage.getItem('puzzleUnlocked');

        if (isUnlocked === 'true') {
            puzzleButton.classList.remove('hidden');
        } else{
            puzzleButton.classList.add('hidden');
        }

        const secretMsgBox = document.getElementById('secret-msg-box');
        const puzzleComplete = localStorage.getItem('puzzleComplete');

        if (puzzleComplete === 'true') {
            secretMsgBox.classList.remove('hidden');
            if (typeof DecryptedText !== 'undefined') {
                    new DecryptedText(secretMsgBox, { speed: 60, maxIterations: 100 });
            }
        }
    })
</script>
